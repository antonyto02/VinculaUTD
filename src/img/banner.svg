<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="titulo">
  <title id="titulo">VinculaUTD: alumnos de la UTD conectados con empresas de Durango</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12324F"/>
      <stop offset="1" stop-color="#2563A8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="24" fill="url(#fondo)"/>
  <circle cx="60" cy="380" r="120" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="760" cy="40" r="110" fill="#FFFFFF" opacity="0.05"/>

  <text x="400" y="74" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Prácticas y estadías en un solo lugar</text>

  <!-- Líneas de conexión -->
  <line x1="262" y1="215" x2="356" y2="215" stroke="#9FD9C0" stroke-width="4" stroke-dasharray="8 10" stroke-linecap="round"/>
  <line x1="444" y1="215" x2="538" y2="215" stroke="#9FD9C0" stroke-width="4" stroke-dasharray="8 10" stroke-linecap="round"/>

  <!-- Alumno -->
  <circle cx="170" cy="215" r="90" fill="#FFFFFF"/>
  <path d="M138 212 L138 240 Q170 260 202 240 L202 212 L170 228 Z" fill="#2563A8"/>
  <polygon points="108,196 170,166 232,196 170,226" fill="#12324F"/>
  <line x1="222" y1="201" x2="222" y2="238" stroke="#1F9D6B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="222" cy="242" r="6" fill="#1F9D6B"/>

  <!-- Coincidencia -->
  <circle cx="400" cy="215" r="42" fill="#1F9D6B"/>
  <path d="M381 216 L394 229 L419 202" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="290" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#BFE8D6">Match</text>

  <!-- Empresa -->
  <circle cx="630" cy="215" r="90" fill="#FFFFFF"/>
  <rect x="582" y="157" width="96" height="10" rx="3" fill="#2563A8"/>
  <rect x="590" y="167" width="80" height="98" fill="#12324F"/>
  <g fill="#BFD6EE">
    <rect x="600" y="178" width="12" height="14"/>
    <rect x="624" y="178" width="12" height="14"/>
    <rect x="648" y="178" width="12" height="14"/>
    <rect x="600" y="200" width="12" height="14"/>
    <rect x="624" y="200" width="12" height="14"/>
    <rect x="648" y="200" width="12" height="14"/>
    <rect x="600" y="222" width="12" height="14"/>
    <rect x="648" y="222" width="12" height="14"/>
  </g>
  <rect x="620" y="241" width="20" height="24" fill="#1F9D6B"/>
  <line x1="572" y1="266" x2="688" y2="266" stroke="#12324F" stroke-width="4" stroke-linecap="round"/>

  <!-- Etiquetas -->
  <text x="170" y="350" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">Alumnos UTD</text>
  <text x="630" y="350" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">Empresas de Durango</text>
</svg>
